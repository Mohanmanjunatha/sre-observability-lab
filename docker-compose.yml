
services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "5001:5000"
    depends_on:
      - order-service
    restart: unless-stopped

  order-service:
    build: ./order-service
    ports:
      - "5002:5000"
    depends_on:
      - payment-service
    restart: unless-stopped

  payment-service:
    build: ./payment-service
    ports:
      - "5003:5000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api-gateway
      - order-service
      - payment-service
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  splunk:
    image: splunk/splunk:latest
    platform: linux/amd64
    hostname: splunk
    environment:
      SPLUNK_GENERAL_TERMS: "--accept-sgt-current-at-splunk-com"
      SPLUNK_START_ARGS: "--accept-license"
      SPLUNK_PASSWORD: "${SPLUNK_PASSWORD:?Set SPLUNK_PASSWORD in .env}"
      SPLUNK_HEC_TOKEN: "${SPLUNK_HEC_TOKEN:?Set SPLUNK_HEC_TOKEN in .env}"
    ports:
      - "8000:8000"
      - "8088:8088"
    volumes:
      - splunk-data:/opt/splunk/var
      - splunk-etc:/opt/splunk/etc
    restart: unless-stopped

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: sre-jenkins-custom:latest
    container_name: sre-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    group_add:
      - "0"
    restart: unless-stopped

volumes:
  grafana-data:
  splunk-data:
  splunk-etc:
  jenkins-data:
